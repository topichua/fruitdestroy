<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Fruit Destroy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free browser games and calm activities for a short break. Play on your phone or computer, no sign-up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Layout concept: a fruit-stand shelf. One honeydew ground, three mood "crates"
   (watermelon = release energy, mango = just play, mint = slow down) and
   produce-sticker labels for duration and mood. Activity pages put the stage first. */
:root {
  --bg: #f1f6ea;            /* honeydew */
  --surface: #ffffff;
  --surface-2: #e4eedb;
  --ink: #2a1532;           /* blackberry */
  --ink-2: #5f4b67;
  --line: rgba(42, 21, 50, .14);
  --energy: #e2305b;        /* watermelon */
  --energy-ink: #ffffff;
  --energy-soft: #ffe1e8;
  --energy-lip: #9b1638;
  --play: #ffa21f;          /* mango */
  --play-ink: #2a1532;
  --play-soft: #ffedcf;
  --play-lip: #c06d00;
  --calm: #3fa58f;          /* mint */
  --calm-ink: #ffffff;
  --calm-soft: #d8efe8;
  --calm-lip: #22705f;
  --create: #7b4ce0; --create-ink: #ffffff; --create-soft: #ece3ff; --create-lip: #4f2aa6;
  --t1: #ffd9cf; --t2: #fff0c9; --t3: #ffc9d3; --t4: #d6efcd; --t5: #e6ddf3;
  --board: #fbfdf7;
  --sand-bg: #fff8ec;
  --shadow: 0 1px 2px rgba(42,21,50,.08), 0 8px 24px rgba(42,21,50,.08);
  --focus: #7b3fe4;
  --font-display: "Unbounded", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 12px; --r-md: 20px; --r-lg: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170d1c; --surface: #241629; --surface-2: #2f1f36; --ink: #f2f6ea; --ink-2: #c3b4ca;
    --line: rgba(242,246,234,.14);
    --energy: #ff4f7a; --energy-ink: #1a0d14; --energy-soft: #45182a; --energy-lip: #a8274a;
    --play: #ffb347; --play-ink: #1d1022; --play-soft: #43301b; --play-lip: #a8650c;
    --calm: #62cdb6; --calm-ink: #0f1f1c; --calm-soft: #17393a; --calm-lip: #2c7d6b;
    --create: #b28cff; --create-ink: #1a0f2b; --create-soft: #2e2147; --create-lip: #6a45c4;
  --create: #b28cff; --create-ink: #1a0f2b; --create-soft: #2e2147; --create-lip: #6a45c4;
  --t1: #4a2a2a; --t2: #45391f; --t3: #4a2232; --t4: #263d29; --t5: #33284a;
    --board: #1f1324; --sand-bg: #221626;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --focus: #c9a7ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170d1c; --surface: #241629; --surface-2: #2f1f36; --ink: #f2f6ea; --ink-2: #c3b4ca;
  --line: rgba(242,246,234,.14);
  --energy: #ff4f7a; --energy-ink: #1a0d14; --energy-soft: #45182a; --energy-lip: #a8274a;
  --play: #ffb347; --play-ink: #1d1022; --play-soft: #43301b; --play-lip: #a8650c;
  --calm: #62cdb6; --calm-ink: #0f1f1c; --calm-soft: #17393a; --calm-lip: #2c7d6b;
  --t1: #4a2a2a; --t2: #45391f; --t3: #4a2232; --t4: #263d29; --t5: #33284a;
  --board: #1f1324; --sand-bg: #221626;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --focus: #c9a7ff;
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand-mark { width: 36px; height: 36px; flex: none; border-radius: 50%; background: conic-gradient(var(--energy) 0 33%, var(--play) 0 66%, var(--calm) 0); display: grid; place-items: center; }
.brand-mark::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 18px; white-space: nowrap; }
.brand-tag { font-size: 12px; color: var(--ink-2); font-weight: 700; white-space: nowrap; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.head-link { font-weight: 800; text-decoration: none; padding: 8px 12px; border-radius: 999px; }
.head-link:hover { background: var(--surface-2); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
.lang-select { height: 44px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font: inherit; font-weight: 700; color: var(--ink); max-width: min(170px, 40vw); }
@media (max-width: 560px) { .brand-tag, .head-link.hide-sm { display: none; } .brand-name { font-size: 16px; } .site-header .wrap { gap: 8px; } }
@media (max-width: 400px) { .brand-name { font-size: 15px; } .lang-select { max-width: 118px; padding: 0 8px; } .brand-mark { width: 30px; height: 30px; } }

.notice { background: var(--play-soft); border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 700; }
.notice .wrap { padding-block: 8px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; font-weight: 800; font-size: 16px; text-decoration: none; cursor: pointer; transition: transform .12s, box-shadow .12s, background .15s; white-space: nowrap; }
.btn:active { transform: translateY(3px); }
.btn-big { min-height: 60px; font-size: 19px; padding: 0 30px; }
.btn-energy { background: var(--energy); color: var(--energy-ink); box-shadow: 0 5px 0 var(--energy-lip); }
.btn-energy:active { box-shadow: 0 2px 0 var(--energy-lip); }
.btn-play { background: var(--play); color: var(--play-ink); box-shadow: 0 5px 0 var(--play-lip); }
.btn-play:active { box-shadow: 0 2px 0 var(--play-lip); }
.btn-calm { background: var(--calm); color: var(--calm-ink); box-shadow: 0 5px 0 var(--calm-lip); }
.btn-calm:active { box-shadow: 0 2px 0 var(--calm-lip); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* home hero */
.hero { padding-block: 40px 28px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; align-items: center; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-block: 24px 12px; gap: 20px; } }
.hero-copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.hero h1 { font-size: clamp(36px, 6.4vw, 68px); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--energy); }
.hero-sub { font-size: clamp(17px, 2vw, 20px); color: var(--ink-2); max-width: 34ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.continue-chip { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px 8px 8px; font-weight: 700; max-width: 100%; }
.continue-chip .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); flex: none; }
.continue-chip:hover { background: var(--surface-2); }

.bowl { position: relative; aspect-ratio: 5 / 4; max-width: 100%; border-radius: var(--r-lg); background: radial-gradient(120% 90% at 50% 110%, var(--calm-soft), transparent 60%), radial-gradient(90% 70% at 0% 0%, var(--energy-soft), transparent 60%), radial-gradient(90% 70% at 100% 10%, var(--play-soft), transparent 60%), var(--surface); box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 860px) { .bowl { aspect-ratio: 4 / 3; } .bowl-fruit { width: 15%; } }
.bowl-fruit { position: absolute; width: 16%; aspect-ratio: 1; border-radius: 50%; border: 0; display: grid; place-items: center; font-size: clamp(22px, 4.2vw, 44px); cursor: pointer; box-shadow: inset 0 -5px 0 rgba(42,21,50,.08), 0 6px 14px rgba(42,21,50,.12); animation: bob 5s ease-in-out infinite; transition: transform .2s cubic-bezier(.3,1.6,.5,1), opacity .25s; }
.bowl-fruit:hover { transform: scale(1.08); }
.bowl-fruit.popped { transform: scale(1.6); opacity: 0; pointer-events: none; }
.bowl-hint { z-index: 2; pointer-events: none; position: absolute; left: 16px; bottom: 14px; font-size: 13px; font-weight: 800; background: var(--surface); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow); }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }

/* sections */
.section { padding-block: 28px; display: flex; flex-direction: column; gap: 18px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 20px; justify-content: space-between; }
.section h2 { font-size: clamp(24px, 3.4vw, 34px); }
.section-sub { color: var(--ink-2); max-width: 60ch; }

/* moods */
.moods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .moods { grid-template-columns: 1fr; } }
.mood { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px 22px 20px; border-radius: var(--r-lg); text-decoration: none; min-height: 190px; overflow: hidden; transition: transform .15s; }
.mood:hover { transform: translateY(-3px); }
.mood-energy { background: var(--energy-soft); }
.mood-play { background: var(--play-soft); }
.mood-calm { background: var(--calm-soft); }
.mood h3 { font-size: 24px; padding-right: 52px; }
.mood p { color: var(--ink-2); font-weight: 600; max-width: 30ch; }
.mood-list { margin-top: auto; font-size: 14px; font-weight: 800; display: flex; flex-wrap: wrap; gap: 6px; }
.mood-list span { background: var(--surface); border-radius: 999px; padding: 4px 10px; }
.mood-go { position: absolute; right: 18px; top: 18px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.mood-energy .mood-go { background: var(--energy); color: var(--energy-ink); }
.mood-play .mood-go { background: var(--play); color: var(--play-ink); }
.mood-calm .mood-go { background: var(--calm); color: var(--calm-ink); }
.mood-go svg { width: 20px; height: 20px; }
@media (max-width: 860px) { .mood { min-height: 0; } }

/* filter chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* catalog cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 18px; }
.card { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.card-art { display: block; aspect-ratio: 16 / 10; position: relative; overflow: hidden; text-decoration: none; }
.card-body { display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 16px; flex: 1; }
.card h3 { font-size: 19px; }
.card h3 a { text-decoration: none; }
.card p { color: var(--ink-2); font-size: 15px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: .03em; border-radius: 999px; padding: 3px 10px; }
.tag-energy { background: var(--energy-soft); }
.tag-play { background: var(--play-soft); }
.tag-calm { background: var(--calm-soft); }
.card-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.card-foot .btn { margin-left: auto; }
.sticker { position: absolute; right: 12px; top: 12px; background: var(--surface); color: var(--ink); border-radius: 50% / 46%; padding: 6px 12px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 var(--line); transform: rotate(6deg); white-space: nowrap; }
.fav { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.fav svg { width: 20px; height: 20px; }
.fav[aria-pressed="true"] { color: var(--energy); background: var(--energy-soft); border-color: transparent; }
.fav[aria-pressed="true"] svg path { fill: currentColor; }

/* card art */
.art-fd { background: var(--play-soft); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6%; padding: 7% 8%; align-content: center; }
.art-fd span { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(16px, 3vw, 26px); background: var(--surface); box-shadow: inset 0 -3px 0 rgba(42,21,50,.08); }
.art-fd span.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--energy); }
.art-fd.zen { background: var(--calm-soft); }
.art-bubble { background: linear-gradient(180deg, var(--calm-soft), var(--energy-soft)); }
.art-bubble i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 10%, transparent 12%), radial-gradient(circle, transparent 55%, rgba(255,255,255,.55) 68%, var(--c) 100%); border: 1.5px solid color-mix(in srgb, var(--c) 70%, white); }
.art-breathe { background: var(--calm-soft); display: grid; place-items: center; }
.art-breathe .slice { width: 46%; aspect-ratio: 1; }
.art-sand { background: var(--sand-bg); }
.art-sand i { position: absolute; left: -5%; right: -5%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }

/* citrus slice (breathe) */
.slice { border-radius: 50%; background: radial-gradient(circle, #fff6df 0 9%, transparent 10%), repeating-conic-gradient(from 0deg, #ffb13b 0 40deg, #fff2cf 40deg 45deg), #ffb13b; box-shadow: 0 0 0 8px #fff2cf, 0 0 0 14px #ff9a1f, 0 18px 40px rgba(255,140,30,.25); }

/* activity page */
.crumb { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; text-decoration: none; color: var(--ink-2); padding-block: 14px 4px; }
.crumb:hover { color: var(--ink); }
.crumb svg { width: 18px; height: 18px; }
.act-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 6px 14px; }
.act-head h1 { font-size: clamp(26px, 4.4vw, 42px); margin-right: auto; }
.stage { position: relative; height: clamp(420px, calc(100dvh - 210px), 680px); border-radius: var(--r-lg); background: var(--board); box-shadow: var(--shadow); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
@media (max-width: 560px) { .stage { height: clamp(400px, calc(100dvh - 235px), 700px); border-radius: var(--r-md); } .stage.sand-stage { height: clamp(300px, calc(100dvh - 400px), 600px); } .act-head { padding-block: 2px 10px; } .crumb { padding-block: 10px 2px; } }
.stage canvas { display: block; width: 100%; height: 100%; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-block: 12px 4px; }
.bar .spacer { flex: 1; }
.stat { font-weight: 800; font-variant-numeric: tabular-nums; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: color-mix(in srgb, var(--board) 82%, transparent); backdrop-filter: blur(3px); z-index: 5; }
.overlay h2 { font-size: clamp(26px, 4vw, 40px); }
.overlay p { color: var(--ink-2); font-weight: 600; max-width: 40ch; }
.overlay .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.about { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; padding-block: 28px; }
@media (max-width: 860px) { .about { grid-template-columns: 1fr; } }
.about h2 { font-size: 24px; margin-bottom: 10px; }
.about p + p { margin-top: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; }
.steps li::before { content: counter(s); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--surface-2); }
.note { font-size: 14px; color: var(--ink-2); }
details.faq { background: var(--surface); border-radius: var(--r-sm); padding: 14px 16px; }
details.faq + details.faq { margin-top: 10px; }
details.faq summary { font-weight: 800; cursor: pointer; }
details.faq p { margin-top: 8px; color: var(--ink-2); }
.critters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.critter-card { background: var(--surface); border-radius: var(--r-sm); padding: 12px; font-weight: 700; font-size: 14px; }
.critter-card b { font-size: 28px; display: block; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 50; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 800; cursor: pointer; min-height: 32px; }

footer.site-foot { border-top: 1px solid var(--line); margin-top: 32px; }
footer.site-foot .wrap { padding-block: 24px 32px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; font-size: 14px; color: var(--ink-2); }
footer.site-foot nav { display: flex; flex-wrap: wrap; gap: 6px 14px; }
footer.site-foot a { text-decoration: none; }
footer.site-foot a:hover { text-decoration: underline; }
footer.site-foot a[aria-current="true"] { color: var(--ink); font-weight: 800; }
.perks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .perks { grid-template-columns: 1fr; } }
.perk { background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; font-weight: 700; display: flex; gap: 12px; align-items: center; }
.perk svg { width: 26px; height: 26px; flex: none; color: var(--calm); }

/* ===== Fruit Destroy game ===== */
.fd { position: absolute; inset: 0; display: flex; flex-direction: column; }
.fd-hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; }
.fd-pill { background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 1px 0 var(--line); white-space: nowrap; font-size: 15px; }
.fd-pill small { font-weight: 700; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.fd-pill.hot { background: var(--energy); color: var(--energy-ink); }
.fd-meter { flex: 1 1 120px; height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 80px; }
.fd-meter i { display: block; height: 100%; background: var(--calm); border-radius: 999px; transition: width .3s; }
.fd-meter.warn i { background: var(--energy); }
.fd-board { position: relative; flex: 1; margin: 0 10px 10px; border-radius: var(--r-md); background: var(--surface-2); }
.fd-fruit { position: absolute; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; line-height: 1; cursor: pointer; touch-action: manipulation; box-shadow: inset 0 -4px 0 rgba(42,21,50,.10), 0 2px 4px rgba(42,21,50,.12); transition: transform .18s cubic-bezier(.3,1.6,.5,1), opacity .28s, box-shadow .18s; animation: fd-in .32s ease-out; }

.fd-fruit.pop { transform: scale(1.5) !important; opacity: 0; pointer-events: none; }

.fd-float { position: absolute; font-family: var(--font-display); font-weight: 800; font-size: clamp(16px, 2.6vw, 24px); color: var(--energy); text-shadow: 0 2px 0 var(--board), 0 -2px 0 var(--board), 2px 0 0 var(--board), -2px 0 0 var(--board); pointer-events: none; z-index: 4; white-space: nowrap; animation: fd-float .9s ease-out forwards; }
.fd-menu { position: absolute; inset: 0; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-content: center; background: var(--board); z-index: 6; }
@media (max-width: 760px) { .fd-menu { grid-template-columns: 1fr; align-content: start; padding: 16px; gap: 14px; } }
.fd-menu-hero { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.fd-menu-hero .fruits { font-size: 34px; letter-spacing: 4px; }
.fd-menu-hero h2 { font-size: clamp(26px, 4vw, 44px); }
.fd-best { color: var(--ink-2); font-weight: 700; font-size: 15px; }
.fd-modes { display: flex; flex-direction: column; gap: 10px; }
.fd-mode { display: grid; grid-template-columns: 46px 1fr 24px; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 2px solid transparent; background: var(--surface); cursor: pointer; min-height: 64px; }
.fd-mode:hover { border-color: var(--line); }
.fd-mode.on { border-color: var(--ink); }
.fd-mode .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; }
.fd-mode b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.fd-mode span.d { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.fd-result { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 6; animation: fd-screen .35s ease-out; }
.fd-result.win { background: var(--calm-soft); }
.fd-result.lose { background: var(--energy-soft); }
.fd-result .k { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.fd-result h2 { font-size: clamp(36px, 7vw, 72px); }
.fd-result .score { font-family: var(--font-display); font-size: clamp(28px, 5vw, 48px); font-variant-numeric: tabular-nums; }
.fd-stars { display: flex; gap: 6px; font-size: 44px; line-height: 1; }

.fd-stars span.on { filter: none; animation: fd-in .4s both; }
.fd-stats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.fd-stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.fd-stats small { color: var(--ink-2); font-weight: 700; }
.badge-new { background: var(--play); color: var(--play-ink); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px; }
@keyframes fd-in { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
@keyframes fd-shake { 0%,100% { translate: 0; } 20% { translate: -9px; } 40% { translate: 8px; } 60% { translate: -6px; } 80% { translate: 4px; } }
@keyframes fd-nudge { 0%,100% { translate: 0; } 50% { translate: 0 -4px; } }
@keyframes fd-float { 0% { opacity: 0; translate: 0 6px; } 15% { opacity: 1; } 100% { opacity: 0; translate: 0 -54px; } }
@keyframes fd-screen { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fd-wiggle { from { rotate: -8deg; } to { rotate: 8deg; } }

/* ===== Breathe ===== */
.br-stage { background: radial-gradient(80% 70% at 50% 55%, var(--calm-soft), var(--board)); }
.br-center { position: absolute; inset: 0; display: grid; place-items: center; }

.br-orb .slice { position: absolute; inset: 12%; transform: scale(.6); will-change: transform; }
.br-label { position: relative; z-index: 2; background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: 999px; padding: 10px 22px; text-align: center; box-shadow: var(--shadow); }

.br-label span { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink-2); }
.br-phasebar { position: absolute; left: 24px; right: 24px; bottom: 20px; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.br-phasebar i { display: block; height: 100%; width: 0; background: var(--calm); }
.br-settings { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; padding: 24px; background: var(--board); z-index: 4; }

.br-settings legend { font-weight: 800; margin-bottom: 8px; text-align: center; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.seg span { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: 6px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; line-height: 1.2; }
.seg span small { font-weight: 700; color: var(--ink-2); font-size: 12px; }
.seg input:checked + span { background: var(--calm); color: var(--calm-ink); border-color: transparent; }
.seg input:checked + span small { color: inherit; }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.custom-pace { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-weight: 700; }
.custom-pace label { display: flex; align-items: center; gap: 8px; }

.toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--calm); }

/* ===== Sand ===== */
.sand-stage { background: var(--sand-bg); cursor: crosshair; }
.stage.sand-stage { height: clamp(320px, calc(100dvh - 340px), 620px); }
@media (max-height: 520px) { .stage, .stage.sand-stage { height: max(300px, calc(100dvh - 24px)); } }
.sand-stage canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; }

.sizes { display: flex; gap: 6px; }

.sizes button i { display: block; border-radius: 50%; background: var(--ink); }
.sizes button[aria-pressed="true"] { background: var(--surface-2); box-shadow: 0 0 0 3px var(--ink); }
.save-view { position: fixed; inset: 0; z-index: 60; background: rgba(20,10,24,.72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.save-card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; max-width: min(560px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.save-card img { border-radius: var(--r-sm); width: 100%; height: auto; box-shadow: 0 0 0 1px var(--line); }
.save-card .row { display: flex; flex-wrap: wrap; gap: 10px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ===== v2: four moods, catalog, home shelves, fullscreen ===== */
.btn-create { background: var(--create); color: var(--create-ink); box-shadow: 0 5px 0 var(--create-lip); }
.btn-create:active { box-shadow: 0 2px 0 var(--create-lip); }
.btn:focus-visible { outline-offset: 4px; }
.btn-energy:hover, .btn-play:hover, .btn-calm:hover, .btn-create:hover { filter: brightness(1.05); transform: translateY(-1px); }
.mood-create { background: var(--create-soft); }
.mood-create .mood-go { background: var(--create); color: var(--create-ink); }
.tag-create { background: var(--create-soft); }
.tag-type { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.moods { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .moods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .moods { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .mood { padding: 16px; min-height: 150px; } .mood h3 { font-size: 18px; padding-right: 0; } .mood p { font-size: 13px; } .mood-go { display: none; } }
.mood { min-height: 210px; }
.mood-ico { font-size: 30px; line-height: 1; }
.mood-count { margin-top: auto; font-size: 13px; font-weight: 800; color: var(--ink-2); }

/* pace: active cards are saturated with a bold base, calm cards are softer and rounder */
.card { position: relative; transition: transform .15s, box-shadow .15s; }
.card:not(.soon):hover { transform: translateY(-3px); }
.card.pace-active { box-shadow: 0 4px 0 color-mix(in srgb, var(--energy) 55%, transparent), var(--shadow); }
.card.pace-calm { box-shadow: 0 0 0 1px var(--line), var(--shadow); border-radius: var(--r-lg); }
.card.pace-calm .card-art { margin: 8px 8px 0; border-radius: calc(var(--r-lg) - 8px); }
.pace-badge { position: absolute; left: 12px; bottom: 10px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--surface); }
.pace-active .pace-badge { background: var(--energy); color: var(--energy-ink); }
.card.soon { background: transparent; box-shadow: inset 0 0 0 2px var(--line); border-radius: var(--r-md); }
.card.soon .card-art { filter: saturate(.55); opacity: .85; }
.card.soon h3, .card.soon p { color: var(--ink-2); }
.soon-sticker { transform: rotate(-4deg); background: var(--ink); color: var(--bg); }
.soon-note { font-size: 13px; font-weight: 700; color: var(--ink-2); min-height: 44px; display: flex; align-items: center; }
.art-soon { display: grid; place-items: center; }
.art-soon-energy { background: var(--energy-soft); } .art-soon-play { background: var(--play-soft); } .art-soon-calm { background: var(--calm-soft); } .art-soon-create { background: var(--create-soft); }
.soon-e { display: flex; gap: 6%; font-size: clamp(30px, 5vw, 44px); }
.soon-e b:nth-child(2) { transform: translateY(-10px) scale(1.15); }
.art-sand { background: var(--sand-bg); }

/* home: corner, shelves, explainer */
.mine-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .mine-grid { grid-template-columns: 1fr; } }
.mini-h { font-size: 15px; font-family: var(--font-body); font-weight: 800; color: var(--ink-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
.rail { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.rail-item { flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--surface); text-decoration: none; box-shadow: 0 0 0 1px var(--line); }
a.rail-item:hover { background: var(--surface-2); }
.rail-item b { display: block; font-size: 15px; white-space: nowrap; }
.rail-item small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.rail-e { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--surface-2); flex: none; }
.rail-item.soon { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.rail-item.soon .rail-e { filter: saturate(.5); }
.shelf h2 { display: flex; align-items: center; gap: 10px; font-size: clamp(20px, 2.6vw, 26px); }
.shelf-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.shelf-energy .shelf-dot, .shelf-energy a.rail-item .rail-e { background: var(--energy-soft); } .shelf-energy .shelf-dot { background: var(--energy); }
.shelf-play .shelf-dot { background: var(--play); } .shelf-play a.rail-item .rail-e { background: var(--play-soft); }
.shelf-calm .shelf-dot { background: var(--calm); } .shelf-calm a.rail-item .rail-e { background: var(--calm-soft); }
.shelf-create .shelf-dot { background: var(--create); } .shelf-create a.rail-item .rail-e { background: var(--create-soft); }
.shelf { padding-block: 12px; gap: 10px; }
.see-all { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; text-decoration: none; min-height: 44px; }
.see-all:hover { text-decoration: underline; }
.explain { background: var(--surface); border-radius: var(--r-lg); padding: 28px clamp(16px, 3vw, 32px); margin-top: 20px; }
.explain-steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .explain-steps { grid-template-columns: 1fr; } }
.explain-steps li { display: flex; flex-direction: column; gap: 6px; }
.explain-steps b { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.explain-steps span:not(.ex-ico) { color: var(--ink-2); }
.ex-ico { font-size: 28px; }
.explain .perk { background: var(--bg); }

/* catalog: search + filters */
.filters { display: flex; flex-direction: column; gap: 12px; }
.search { position: relative; max-width: 560px; }
.search svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--ink-2); pointer-events: none; }
.search input { width: 100%; min-height: 52px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; padding: 0 18px 0 46px; }
.search input:focus { border-color: var(--ink); outline: none; }
.chip-sm { min-height: 36px; font-size: 14px; padding: 0 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-energy[aria-current="true"] { background: var(--energy); border-color: var(--energy); color: var(--energy-ink); }
.chip-play[aria-current="true"] { background: var(--play); border-color: var(--play); color: var(--play-ink); }
.chip-calm[aria-current="true"] { background: var(--calm); border-color: var(--calm); color: var(--calm-ink); }
.chip-create[aria-current="true"] { background: var(--create); border-color: var(--create); color: var(--create-ink); }
.soon-toggle { margin-left: auto; font-size: 14px; }
@media (max-width: 560px) { .soon-toggle { margin-left: 0; } .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; } .chips .toggle { flex: none; } .chip { flex: none; } }
.result-count { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.soon-head { margin-top: 26px; margin-bottom: 14px; }
.soon-head h2 { font-size: clamp(20px, 2.6vw, 26px); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 28px; border-radius: var(--r-md); background: var(--surface); }

/* activity page variants */
.act-lead { color: var(--ink-2); font-weight: 600; margin: -6px 0 12px; max-width: 60ch; }
.act-calm .stage { box-shadow: 0 0 0 1px var(--line); }
.act-create .bar { background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; margin-top: 10px; }
.fs-exit { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); z-index: 9; display: none; }
.stage.is-max { position: fixed; inset: 0; height: auto !important; border-radius: 0; z-index: 70; }
.stage.is-max .fs-exit, .stage:fullscreen .fs-exit { display: grid; }
.stage:fullscreen { height: 100% !important; border-radius: 0; }
body.stage-max { overflow: hidden; }
.bp-setup { justify-content: center; gap: 14px; overflow-y: auto; }
.bp-settings { display: flex; flex-direction: column; gap: 12px; }
.bp-settings fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bp-settings legend { font-weight: 800; padding: 0; margin-bottom: 6px; }

/* footer */
footer.site-foot .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.4fr; gap: 24px; align-items: start; }
@media (max-width: 860px) { footer.site-foot .foot-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { footer.site-foot .foot-grid { grid-template-columns: 1fr; } }
.foot-brand { display: flex; flex-direction: column; gap: 6px; }
footer.site-foot nav { display: flex; flex-direction: column; gap: 6px; }
.foot-h { font-family: var(--font-body); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); margin-bottom: 4px; }
.foot-langs { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.foot-legal { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
footer.site-foot a { min-height: 28px; display: inline-flex; align-items: center; }
h1[tabindex="-1"]:focus { outline: none; }

/* ===== v3: game kit and the 24 newer activities ===== */
.kit-stage { outline: none; }
.kit-stage:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
.k-layer { position: absolute; inset: 0; display: grid; place-items: center; }
.k-layer:empty { pointer-events: none; }
.kit-stage canvas { position: absolute; inset: 0; }
.k-ov:empty { display: none; }
.k-kicker { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.k-big { font-family: var(--font-display); font-size: clamp(28px, 5vw, 48px); font-weight: 800; font-variant-numeric: tabular-nums; }
.k-result { overflow-y: auto; }
.mini-seg { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mini-seg legend { font-weight: 800; padding: 0; margin-bottom: 6px; }
.emo-sw { background: var(--surface); display: grid; place-items: center; font-size: 22px; }
.art-live .soon-e { filter: none; }
.bar .palette { flex-wrap: wrap; }

/* merge */
.merge-board { position: relative; background: var(--surface-2); border-radius: var(--r-md); touch-action: none; }
.mcell { position: absolute; border-radius: 14px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.mtile { position: absolute; left: 0; top: 0; border-radius: 14px; display: grid; place-items: center; line-height: 1; box-shadow: inset 0 -4px 0 rgba(42,21,50,.1); transition: transform .12s ease-out; }
.mtile.fresh { animation: fd-in .2s ease-out; }
.mtile.merged { animation: mpop .18s ease-out; }
@keyframes mpop { 50% { scale: 1.15; } }

/* sort */
.jars { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px; padding: 16px; max-width: 100%; }
.jar { width: 64px; height: 230px; border-radius: 0 0 26px 26px; border: 3px solid var(--ink-2); border-top: 0; background: color-mix(in srgb, var(--surface) 70%, transparent); display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; padding: 6px 0; gap: 2px; cursor: pointer; transition: transform .15s; }
.jar span { height: 50px; font-size: 38px; line-height: 50px; }
.jar.sel { transform: translateY(-12px); border-color: var(--energy); }
.jar.nope { animation: fd-shake .3s; }
@media (max-width: 560px) { .jar { width: 46px; height: 180px; } .jar span { height: 40px; font-size: 28px; line-height: 40px; } .jars { gap: 8px; } }

/* memory + flip */
.mem-grid, .flip-grid { display: grid; gap: 10px; justify-content: center; align-content: center; }
.flip-grid { gap: 8px; }
.mem-card { perspective: 600px; border: 0; padding: 0; background: none; cursor: pointer; }
.mem-in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }

const Sound = {
  ctx: null,
  on: Store.get('sound', true),
  ensure() {
    if (!this.on) return null;

      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }

    } catch (e) { return null; }
    return this.ctx;
  },
  tone(freq, dur = 0.12, type = 'sine', vol = 0.12, slide = 0) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  pop(size = 0.5) { this.tone(1100 - size * 600, 0.09, 'sine', 0.14, 0.45); },
  match(combo = 1) { const f = 520 * Math.pow(1.06, Math.min(combo, 10)); this.tone(f, 0.12, 'triangle', 0.12); setTimeout(() => this.tone(f * 1.5, 0.14, 'triangle', 0.1), 70); },
  miss() { this.tone(180, 0.16, 'sine', 0.08, 0.8); },
  shoo() { this.tone(700, 0.08, 'square', 0.05, 1.6); },
  chime(up = true) { this.tone(up ? 523 : 392, 0.9, 'sine', 0.05); },
  win() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.22, 'triangle', 0.1), i * 110)); },
  setOn(v) { this.on = v; Store.set('sound', v); if (!v && this.ctx) { try { this.ctx.suspend(); } catch (e) {} } document.querySelectorAll('[data-sound-toggle]').forEach(syncSoundBtn); track('sound_toggle', { on: v }); }

const PAGES = ['home', 'activities', 'activities-energy', 'activities-play', 'activities-calm', 'activities-create', 'fruit-destroy', 'fruit-destroy-zen', 'fruit-destroy-quick', 'bubble-pop', 'breathe', 'sand-art'];

}
function parseHash() {

  for (const l of [...LANGS].sort((a, b) => b.code.length - a.code.length)) {
    if (h === l.code) { lang = l.code; h = 'home'; break; }
    if (h.startsWith(l.code + '-')) { lang = l.code; h = h.slice(l.code.length + 1); break; }

}
function detectLang() {

  if (nav.startsWith('zh')) return 'zh';

/* ---------- SEO: per-route title/description/canonical/hreflang/JSON-LD ---------- */
function setMeta({ title, description, page, jsonld }) {
  const info = langInfo(LANG), ready = !!info.ready;
  const canonPage = page.replace(/^fruit-destroy-(zen|quick)$/, 'fruit-destroy');
  const indexed = ready && canonPage === page;
  const canonLang = ready ? LANG : 'en';
  const canonical = `${SITE}/${canonLang}/${pageSlug(canonPage)}`;
  document.documentElement.lang = ready ? (info.hreflang || LANG) : 'en';
  document.documentElement.dir = ready && info.dir === 'rtl' ? 'rtl' : 'ltr';
  document.title = title;
  const head = document.head;
  const ensure = (sel, tag) => head.querySelector(sel) || head.appendChild(document.createElement(tag));
  const desc = ensure('meta[name="description"]', 'meta');
  desc.setAttribute('name', 'description');
  desc.setAttribute('content', description);
  const robots = ensure('meta[name="robots"]', 'meta');
  robots.setAttribute('name', 'robots');
  robots.setAttribute('content', indexed ? 'index, follow, max-image-preview:large' : 'noindex, follow');
  const canon = ensure('link[rel="canonical"]', 'link');
  canon.setAttribute('rel', 'canonical');
  canon.setAttribute('href', canonical);
  head.querySelectorAll('link[rel="alternate"][hreflang]').forEach(n => n.remove());
  const alt = (hl, href) => { const n = document.createElement('link'); n.rel = 'alternate'; n.hreflang = hl; n.href = href; head.appendChild(n); };
  LANGS.filter(l => l.ready).forEach(l => alt(l.hreflang || l.code, `${SITE}/${l.code}/${pageSlug(canonPage)}`));
  alt('x-default', `${SITE}/en/${pageSlug(canonPage)}`);
  head.querySelectorAll('[data-seo]').forEach(n => n.remove());
  const add = (tag, attrs) => { const n = document.createElement(tag); for (const k in attrs) n.setAttribute(k, attrs[k]); n.setAttribute('data-seo', ''); head.appendChild(n); return n; };
  add('meta', { property: 'og:type', content: 'website' });
  add('meta', { property: 'og:site_name', content: 'Fruit Destroy' });
  add('meta', { property: 'og:title', content: title });
  add('meta', { property: 'og:description', content: description });
  add('meta', { property: 'og:url', content: canonical });
  add('meta', { property: 'og:locale', content: langInfo(canonLang).og || 'en_US' });
  add('meta', { name: 'twitter:card', content: 'summary_large_image' });
  if (jsonld) { const s = add('script', { type: 'application/ld+json' }); s.textContent = JSON.stringify(jsonld); }
}

function mountBowl(el) {
  const fr = ['🍓', '🍋', '🍉', '🍇', '🍑', '🫐', '🍊', '🍒', '🥝'], tints = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)', 'var(--t5)'];
  const spots = [[8, 12], [30, 6], [54, 14], [76, 8], [18, 40], [42, 36], [66, 40], [6, 66], [30, 64], [56, 66], [78, 64]];
  const timers = new Set();

  spots.forEach(([l, t], i) => {

const Router = {
  page: 'home', cleanup: null, activity: null,
  go() {
    migrateHash();
    let route = splitRoute(location.pathname);
    if (!route) {
      const next = href('home', detectLang()) + location.search;
      if (next !== location.pathname + location.search || location.hash) history.replaceState({ fd: true }, '', next);
      route = splitRoute(location.pathname) || { lang: detectLang(), page: 'home' };
    }
    const { lang, page } = route.page ? route : { lang: route.lang, page: 'home' };
    if (!route.page) history.replaceState({ fd: true }, '', href('home', lang) + location.search);
    if (lang !== 'en' && langInfo(lang).ready && ((!STR[lang] && !localeMiss.has(lang)) || (lang !== 'uk' && !GT[lang] && !gameMiss.has(lang)))) {
      ensureLocale(lang).then(() => this.go());
      return;
    }
    LANG = lang;
    const prevActivity = this.activity;
    if (this.cleanup) { try { this.cleanup(); } catch (e) { console.error(e); } this.cleanup = null; }
    this.page = page;
    renderChrome();
    const main = document.getElementById('main');
    let act = null, variant = null;
    if (page === 'home') this.cleanup = renderHome(main);
    else if (page.startsWith('activities')) renderCatalog(main, page.split('-')[1] || null);
    else {

      act = actById(m ? 'fruit-destroy' : page); variant = m ? m[1] : null;
      this.cleanup = renderActivity(main, act, variant);
      track('activity_view', { activity: act.id, variant });
      if (prevActivity && prevActivity !== act.id) track('activity_switch', { from: prevActivity, to: act.id });
    }
    this.activity = act ? act.id : prevActivity;
    main.querySelectorAll('[data-fav]').forEach(syncFavBtn);
    main.querySelectorAll('[data-sound-toggle]').forEach(syncSoundBtn);
    window.scrollTo(0, 0);
    const h1 = main.querySelector('h1'); if (h1 && this.booted) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    this.booted = true;
  }
};

document.addEventListener('click', e => {
  const s = e.target.closest('[data-sound-toggle]'); if (s) { Sound.setOn(!Sound.on); if (Sound.on) Sound.pop(0.4); return; }
  const f = e.target.closest('[data-fav]'); if (f) { toggleFav(f.dataset.fav); return; }
  const a = e.target.closest('a[href]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target === '_blank') return;
  const raw = a.getAttribute('href');
  if (!raw || raw === '#') return;

  const dest = splitRoute(url.pathname);

        stats: [[fmtTime(s.elapsed), T('fd.survived')], [acc + '%', T('fd.accuracy')], [s.bestCombo, T('fd.bestCombo')]] };

}

/* makeKit(host, o)
   o.id, o.btn (button colour class), o.canvas (default true), o.html (extra markup inside the stage),
   o.tools (extra controls in the bar), o.below (markup under the bar), o.restart (default true), o.save (fn -> canvas),
   o.onStart(isRestart), o.onResize(), o.start: {title, sub, label, extra} or false to skip the start screen. */
function makeKit(host, o) {
  const id = o.id;
  host.innerHTML = `<div class="stage kit-stage ${o.stageClass || ''}" tabindex="0" aria-label="${esc(G(id, 'label'))}">${o.canvas === false ? '' : '<canvas></canvas>'}<div class="k-layer">${o.html || ''}</div><div class="k-ov"></div></div>
    <div class="bar"><span class="stat k-stat" aria-live="polite"></span><span class="spacer"></span>${o.tools || ''}
      ${o.restart === false ? '' : `<button class="btn btn-sm btn-ghost k-restart" type="button">${ICON.restart}${esc(o.restartLabel || T('restart'))}</button>`}
      ${o.save ? `<button class="btn btn-sm ${o.btn} k-save" type="button">${ICON.save}${esc(T('sand-art.save'))}</button>` : ''}
      ${soundBtn()}</div>${o.below || ''}`;
  host.querySelectorAll('[data-sound-toggle]').forEach(syncSoundBtn);
  const stage = host.querySelector('.kit-stage'), cv = host.querySelector('.kit-stage canvas');
  const k = {
    id, host, stage, cv, ctx: cv ? cv.getContext('2d') : null, layer: host.querySelector('.k-layer'), ov: host.querySelector('.k-ov'),
    W: 0, H: 0, dpr: 1, started: false, raf: 0, frameFn: null, last: 0, dead: false, cleanups: [], timers: new Set()
  };
  k.$ = sel => host.querySelector(sel);
  k.$$ = sel => [...host.querySelectorAll(sel)];
  k.on = (el, ev, fn, opt) => { el.addEventListener(ev, fn, opt); k.cleanups.push(() => el.removeEventListener(ev, fn, opt)); };
  k.later = (fn, ms) => { const t = setTimeout(() => { k.timers.delete(t); if (!k.dead) fn(); }, ms); k.timers.add(t); return t; };
  k.stat = txt => { k.$('.k-stat').textContent = txt; };
  k.resize = () => {
    const b = stage.getBoundingClientRect(); k.W = b.width; k.H = b.height; k.dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv) { cv.width = Math.round(k.W * k.dpr); cv.height = Math.round(k.H * k.dpr); k.ctx.setTransform(k.dpr, 0, 0, k.dpr, 0, 0); }

  const step = now => {
    k.raf = 0; if (k.dead || !k.frameFn) return;

    const keep = k.frameFn(dt, now);

  };
  k.run = fn => { k.frameFn = fn; if (!k.raf && !k.dead) { k.last = 0; k.raf = requestAnimationFrame(step); } };
  k.wake = () => { if (k.frameFn && !k.raf && !k.dead) { k.last = 0; k.raf = requestAnimationFrame(step); } };
  k.halt = () => { k.frameFn = null; cancelAnimationFrame(k.raf); k.raf = 0; };
  k.pt = e => { const b = stage.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  k.pointer = h => {
    let down = false;
    k.on(stage, 'pointerdown', e => {
      if (!k.started || e.target.closest('button, input, select, a, label')) return;
      down = true; try { stage.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); h.down && h.down(k.pt(e), e);
    });
    k.on(stage, 'pointermove', e => { if (!k.started) return; h.move && h.move(k.pt(e), e, down); });
    const up = e => { if (!down) return; down = false; h.up && h.up(k.pt(e), e); };

  };
  k.overlay = (html, cls = '') => { k.ov.innerHTML = html ? `<div class="overlay ${cls}">${html}</div>` : ''; return k.ov.firstElementChild; };
  k.begin = isRestart => {
    k.overlay(''); k.started = true; Sound.ensure(); setLast(id);
    track(isRestart ? 'activity_restart' : 'activity_start', { activity: id });
    o.onStart && o.onStart(!!isRestart);
  };
  k.startScreen = () => {
    if (o.start === false) { k.begin(false); return; }
    const s = o.start || {};
    const el = k.overlay(`<h2>${esc(s.title || T(id + '.name'))}</h2><p>${esc(s.sub || G(id, 'hint'))}</p>${s.extra || ''}
      <button class="btn btn-big ${o.btn} k-go" type="button">${ICON.play}${esc(s.label || G(id, 'startBtn'))}</button>`);
    el.querySelector('.k-go').onclick = () => { s.beforeStart && s.beforeStart(el); k.begin(false); stage.focus({ preventScroll: true }); };
  };
  k.result = r => {
    if (r.track !== false) track('activity_complete', { activity: id, ...(r.data || {}) });
    if (r.sound !== false) Sound.win();
    const el = k.overlay(`<span class="k-kicker">${esc(r.kicker || T(id + '.name'))}</span><h2>${esc(r.title)}</h2>
      ${r.big ? `<div class="k-big">${esc(r.big)}</div>` : ''}${r.isNew ? `<span class="badge-new">${esc(G(id, 'newBest'))}</span>` : ''}
      ${r.sub ? `<p>${esc(r.sub)}</p>` : ''}
      ${r.stats ? `<div class="fd-stats">${r.stats.map(([v, l]) => `<div><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('')}</div>` : ''}
      <div class="row">${r.next ? `<button class="btn btn-big ${o.btn} k-next" type="button">${ICON.play}${esc(r.nextLabel || G(id, 'next'))}</button>` : ''}
      <button class="btn ${r.next ? 'btn-ghost' : 'btn-big ' + o.btn} k-again" type="button">${ICON.restart}${esc(r.againLabel || G(id, 'again'))}</button>
      ${r.extraBtn || ''}<a class="btn btn-ghost" href="${href('activities')}">${esc(T('backActivities'))}</a></div>`, 'k-result');
    el.querySelector('.k-again').onclick = () => k.begin(true);
    if (r.next) el.querySelector('.k-next').onclick = () => { k.overlay(''); r.next(); };
    if (r.onExtra) r.onExtra(el);
    (el.querySelector('.k-next') || el.querySelector('.k-again')).focus({ preventScroll: true });
  };
  if (o.restart !== false) host.querySelector('.k-restart').onclick = () => { if (!k.started) return k.begin(false); k.begin(true); };
  if (o.save) host.querySelector('.k-save').onclick = () => { const c = o.save(); if (c) showSaveView(c, id, o.saveTitle); };
  k.on(document, 'visibilitychange', () => { if (!document.hidden) k.wake(); o.onHidden && document.hidden && o.onHidden(); });
  let ro = null;
  if (window.ResizeObserver) { ro = new ResizeObserver(() => k.resize()); ro.observe(stage); }
  k.destroy = () => {
    k.dead = true; k.halt(); k.timers.forEach(clearTimeout); k.cleanups.forEach(f => f()); ro && ro.disconnect();
    o.onDestroy && o.onDestroy(); document.querySelectorAll('.save-view').forEach(n => n.remove());
  };
  k.init = () => { k.resize(); k.startScreen(); return k.destroy; };
  return k;
}

  return k.init();
};

/* Ambient synth (no audio files): rain, wind, stream, birds, crickets. Shared by Orchard Sounds and Fruit Garden. */
function makeAmbient() {
  const A = { ctx: null, tracks: {}, master: null, birdT: 0, cricketT: 0, levels: { rain: 0, wind: 0, stream: 0, birds: 0, crickets: 0 }, on: false };
  function noiseBuf(c, type) {
    const b = c.createBuffer(1, c.sampleRate * 3, c.sampleRate), d = b.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (type === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
    return b;
  }
  A.start = () => {
    const c = Sound.ensure(); if (!c) return false; A.ctx = c;
    if (!A.master) {
      A.master = c.createGain(); A.master.gain.value = 0; A.master.connect(c.destination);
      const mk = (name, buf, type, f, q) => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = c.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(A.master); s.start(); A.tracks[name] = { g, fl }; };
      const white = noiseBuf(c, 'white'), brown = noiseBuf(c, 'brown');
      mk('rain', white, 'bandpass', 2400, 0.6); mk('wind', brown, 'lowpass', 500, 0.8); mk('stream', white, 'bandpass', 900, 1.2);
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.12; lg.gain.value = 280; lfo.connect(lg); lg.connect(A.tracks.wind.fl.frequency); lfo.start();
      A.tracks.birds = { g: c.createGain() }; A.tracks.birds.g.connect(A.master); A.tracks.crickets = { g: c.createGain() }; A.tracks.crickets.g.connect(A.master);
      A.timer = setInterval(A.tickChirps, 120);
    }
    A.on = true; A.apply(); A.master.gain.setTargetAtTime(0.9, c.currentTime, 0.4); return true;
  };
  A.apply = () => { if (!A.ctx) return; const t = A.ctx.currentTime, L = A.levels; A.tracks.rain.g.gain.setTargetAtTime(L.rain * 0.5, t, 0.2); A.tracks.wind.g.gain.setTargetAtTime(L.wind * 0.9, t, 0.2); A.tracks.stream.g.gain.setTargetAtTime(L.stream * 0.35, t, 0.2); A.tracks.birds.g.gain.setTargetAtTime(L.birds * 0.25, t, 0.2); A.tracks.crickets.g.gain.setTargetAtTime(L.crickets * 0.05, t, 0.2); };
  A.tickChirps = () => {
    if (!A.on || !A.ctx) return; const c = A.ctx, t = c.currentTime;
    if (A.levels.birds > 0 && Math.random() < 0.06 + A.levels.birds * 0.08) {
      const base = 2200 + Math.random() * 1800, n = 1 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) { const o = c.createOscillator(), g = c.createGain(), s = t + i * (0.09 + Math.random() * 0.05); o.type = 'sine'; o.frequency.setValueAtTime(base, s); o.frequency.exponentialRampToValueAtTime(base * (1.2 + Math.random() * 0.5), s + 0.07); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.5, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.08); o.connect(g); g.connect(A.tracks.birds.g); o.start(s); o.stop(s + 0.1); }
    }
    if (A.levels.crickets > 0 && Math.random() < 0.35) {
      const s = t + Math.random() * 0.1, o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = 4400 + Math.random() * 300;
      g.gain.setValueAtTime(0, s); for (let i = 0; i < 6; i++) { g.gain.setValueAtTime(0.6, s + i * 0.025); g.gain.setValueAtTime(0, s + i * 0.025 + 0.012); }
      o.connect(g); g.connect(A.tracks.crickets.g); o.start(s); o.stop(s + 0.2);
    }
  };
  A.stop = () => { A.on = false; if (A.master && A.ctx) A.master.gain.setTargetAtTime(0, A.ctx.currentTime, 0.3); };
  A.destroy = () => { A.stop(); clearInterval(A.timer); const m = A.master; if (m) setTimeout(() => { try { m.disconnect(); } catch (e) {} }, 1200); };
  return A;
}

GAMES['fruit-garden'] = host => {

/* ===== Fruit Maze engine: pure game rules, no DOM. Runs in the browser and in node tests. =====
   Grid coordinates: x = column, y = row; entity positions are tile centres in tile units.
   Logic advances in fixed 1/60 s steps (MazeEngine.update), so it does not depend on frame rate. */
const MazeEngine = (() => {
  const FRUITS = { a: { e: '🍎', pts: 10 }, b: { e: '🍌', pts: 15 }, o: { e: '🍊', pts: 20 }, s: { e: '🍓', pts: 25 } };
  const ANIMALS = { T: { kind: 'turtle', e: '🐢', speed: 1.5 }, F: { kind: 'fox', e: '🦊', speed: 2.3 }, M: { kind: 'monkey', e: '🐒', speed: 3.0 } };
  const PLAYER_SPEED = 4.2, LIVES = 3, INVULN = 2, HIT_DIST = 0.62, LEVEL_BONUS = 100, STEP = 1 / 60;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const RIGHT = { up: 'right', right: 'down', down: 'left', left: 'up' }, LEFT = { up: 'left', left: 'down', down: 'right', right: 'up' }, BACK = { up: 'down', down: 'up', left: 'right', right: 'left' };

  /* ---------- levels ---------- */
  function parse(def) {

    screen(`<span class="k-kicker">${esc(gv('levelN', { n: lvl }))} · ${esc(g('lvl.' + s.index))}</span><h2>${esc(g('winTitle'))}</h2>
      <div class="fd-stats"><div><b>+${fmtNum(s.levelScore)}</b><small>${esc(g('levelScore'))}</small></div><div><b>${fmtNum(s.score)}</b><small>${esc(g('total'))}</small></div><div><b>${fmtTime(s.time)}</b><small>${esc(g('time'))}</small></div><div><b>${'❤️'.repeat(s.lives)}</b><small>${esc(g('livesLeft'))}</small></div></div>
      <div class="row"><button class="btn btn-big btn-play" type="button" data-a="next">${ICON.play}${esc(g('next'))}</button><button class="btn btn-ghost" type="button" data-a="again">${ICON.restart}${esc(g('again'))}</button></div>`, {
      next: () => startLevel(idx + 1, carry), again: () => startLevel(idx, startCarry, 'restart')
    });
  }
  function complete() {
    mode = 'done'; const isBest = s.score >= prog.best;
    screen(`<span class="k-kicker">${esc(g('completeKicker'))}</span><h2>${esc(g('completeTitle'))}</h2><div class="k-big">${fmtNum(s.score)}</div>${isBest ? `<span class="badge-new">${esc(G(id, 'newBest'))}</span>` : ''}
      <p>${esc(gv('completeSub', { l: s.lives }))}</p><div class="fd-stats"><div><b>${fmtNum(prog.best)}</b><small>${esc(g('bestTotal'))}</small></div></div>
      <div class="row"><button class="btn btn-big btn-play" type="button" data-a="again">${ICON.restart}${esc(g('playFromStart'))}</button><button class="btn btn-ghost" type="button" data-a="menu">${esc(g('chooseLevel'))}</button></div>`, {
      again: () => { track('game_restart', { activity: id }); newGame(0); }, menu
    });
  }
  function gameOver() {
    mode = 'over'; saveProg({ total: s.score }); const lvl = s.index + 1;
    track('game_over', { activity: id, level: lvl, score: s.score, time: Math.round(s.time) });
    [392, 330, 262].forEach((f, i) => setTimeout(() => Sound.tone(f, 0.25, 'sine', 0.07), i * 160));
    screen(`<span class="k-kicker">${esc(gv('levelN', { n: lvl }))}</span><h2>${esc(g('overTitle'))}</h2><p>${esc(g('overSub'))}</p>
      <div class="fd-stats"><div><b>${fmtNum(s.score)}</b><small>${esc(g('hudScore'))}</small><span class="mz-ico" aria-hidden="true">⭐</span><span class="sr-only">${esc(g('hudScore'))}</span></div><div><b>${lvl}</b><small>${esc(g('reached'))}</small></div><div><b>${fmtNum(prog.best)}</b><small>${esc(g('bestTotal'))}</small></div></div>
      <div class="row"><button class="btn btn-big btn-play" type="button" data-a="retry">${ICON.restart}${esc(g('tryAgain'))}</button><button class="btn btn-ghost" type="button" data-a="menu">${esc(g('chooseLevel'))}</button></div>
      <p class="note">${esc(gv('retryNote', { n: lvl }))}</p>`, {
      retry: () => { track('game_restart', { activity: id, level: lvl }); newGame(s.index); }, menu
    });
  }
  function tutorial(then) {
    mode = 'tut';
    const tips = [['👦', 'tut1'], ['🍓', 'tut2'], ['🦊', 'tut3'], ['🏁', 'tut4']];
    screen(`<h2>${esc(g('tutTitle'))}</h2><ul class="mz-tips">${tips.map(([e, t]) => `<li><span aria-hidden="true">${e}</span>${esc(g(t))}</li>`).join('')}</ul>
      <button class="btn btn-big btn-play" type="button" data-a="ok">${esc(g('gotIt'))}</button>`, { ok: () => { Store.set('mazeTut', true); then ? then() : menu(); } });
  }
  function menu() {
    mode = 'menu'; cancelAnimationFrame(raf); held = [];
    if (!s) { s = E.createState(LV, Math.min(prog.unlocked, N) - 1); layout(); }
    screen(`<div class="mz-menu"><div class="mz-menu-copy">
        <span class="k-kicker">${esc(g('kicker'))}</span><h2>Fruit Maze</h2><p>${esc(g('menuDesc'))}</p>
        ${prog.best ? `<p class="fd-best">🏆 ${esc(gv('bestIs', { b: fmtNum(prog.best) }))}</p>` : ''}
        <div class="row"><button class="btn btn-big btn-play" type="button" data-a="play">${ICON.play}${esc(prog.unlocked > 1 ? gv('playFrom', { n: prog.unlocked }) : g('play'))}</button><button class="btn btn-ghost" type="button" data-a="rules">${esc(g('rules'))}</button></div>
        ${storageOk ? '' : `<p class="note">${esc(g('noStorage'))}</p>`}</div>
      <div class="mz-levels" role="group" aria-label="${esc(g('chooseLevel'))}"><h3>${esc(g('chooseLevel'))}</h3><div class="mz-lv-grid">
        ${LV.map((l, i) => { const open = i < prog.unlocked, b = prog.levelBest[i + 1]; return `<button type="button" class="mz-lv-btn" data-l="${i}" ${open ? '' : 'disabled'} aria-label="${esc(gv('levelN', { n: i + 1 }) + ', ' + g('lvl.' + i) + (open ? (b ? ', ' + gv('bestIs', { b }) : '') : ', ' + g('locked')))}"><b>${i + 1}</b><small>${open ? (b ? fmtNum(b) : '—') : '🔒'}</small></button>`; }).join('')}
      </div></div></div>`, { play: () => newGame(Math.min(prog.unlocked, N) - 1), rules: () => tutorial(null) });
    scr.querySelectorAll('.mz-lv-btn').forEach(b => b.onclick = () => newGame(+b.dataset.l));
    hud(); draw();
  }
  function screen(html, actions = {}) {
    scr.innerHTML = html ? `<div class="overlay mz-ov" role="dialog" aria-modal="false">${html}</div>` : '';
    scr.querySelectorAll('[data-a]').forEach(b => b.onclick = () => actions[b.dataset.a] && actions[b.dataset.a]());
    const first = scr.querySelector('.btn-play, .btn'); if (first) first.focus({ preventScroll: true });
    $('.mz-pause').disabled = mode !== 'play';
  }

  /* ---------- controls ---------- */
  const press = d => { held = held.filter(x => x !== d); held.push(d); };
  const release = d => { held = held.filter(x => x !== d); };
  const inGame = e => k.stage.contains(e.target) || e.target === document.body;
  k.on(window, 'keydown', e => {
    if (!inGame(e)) return; // keyboard outside the game keeps its normal behaviour
    const d = DIRKEYS[e.code] || DIRKEYS[e.key];
    if (d && mode === 'play') { e.preventDefault(); press(d); return; }
    if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && (mode === 'play' || mode === 'pause')) { e.preventDefault(); mode === 'play' ? pause() : resume(); }
  });
  k.on(window, 'keyup', e => { const d = DIRKEYS[e.code] || DIRKEYS[e.key]; if (d) release(d); });
  k.on(window, 'blur', () => { held = []; });
  $('.mz-pause').onclick = pause;
  k.$$('.mz-btn').forEach(b => {
    const d = b.dataset.d;
    b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (_) {} press(d); b.classList.add('on'); });
    const up = () => { release(d); b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); press(d); } });
    b.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  k.on(window, 'touchstart', () => { if (!padOn) { padOn = true; layout(); } }, { passive: true });
  // swipe on the board as a shortcut: a swipe holds that direction until the finger lifts
  let sw = null;
  cv.addEventListener('pointerdown', e => { if (mode !== 'play') return; sw = { x: e.clientX, y: e.clientY, d: null }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
  cv.addEventListener('pointermove', e => { if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; if (Math.hypot(dx, dy) < 18) return; const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); if (d !== sw.d) { if (sw.d) release(sw.d); press(d); sw.d = d; } sw.x = e.clientX; sw.y = e.clientY; });
  const swEnd = () => { if (sw && sw.d) release(sw.d); sw = null; }; cv.addEventListener('pointerup', swEnd); cv.addEventListener('pointercancel', swEnd);

  window.__fruitMaze = { get state() { return s; }, get mode() { return mode; }, get progress() { return prog; }, pause, resume }; // for browser tests
  k.cleanups.push(() => { delete window.__fruitMaze; });
  return k.init();
};

/* ===== Register the 24 kit activities as live: catalog entries, routes, page texts ===== */
(function registerGames() {
  const BTN = { energy: 'btn-energy', play: 'btn-play', calm: 'btn-calm', create: 'btn-create' };
  const TYPEWORD = { en: { game: 'free online game', toy: 'relaxing browser toy', relax: 'calm activity', maker: 'creative activity' }, uk: { game: 'безкоштовна онлайн-гра', toy: 'іграшка-антистрес у браузері', relax: 'спокійна активність', maker: 'творча активність' } };
  for (const s of SOON) {
    if (!GAMES[s.id]) { console.warn('[register] no game for', s.id); continue; }
    ACTIVITIES.push({ id: s.id, moods: s.moods, type: s.type, dur: s.dur, btn: BTN[s.moods[0]], emoji: s.e[0], e: s.e, own: s.own, mount: (el, o) => GAMES[s.id](el, o) });
    PAGES.push(s.id);
    for (const l of ['en', 'uk']) {
      const g = GT[l][s.id] || GT.en[s.id], card = SOON_DESC[l][s.id];
      Object.assign(STR[l], {
        [s.id + '.name']: s.n, [s.id + '.h1']: s.n, [s.id + '.card']: card,
        [s.id + '.about']: g.about, [s.id + '.steps']: g.steps,
        ['meta.' + s.id + '.title']: `${s.n}: ${TYPEWORD[l][s.type]} · Fruit Destroy`,
        ['meta.' + s.id + '.desc']: `${card} ${g.about[0]}`.slice(0, 300)
      });
    }
  }
  SOON.length = 0;
  Object.assign(STR.en, { moodCount: '{n} activities', resultCount: '{n} activities' });
  Object.assign(STR.uk, { moodCount: 'Активностей: {n}', resultCount: 'Активностей: {n}' });
})();
(function metaMoods() {
  const names = m => ACTIVITIES.filter(a => a.moods.includes(m)).map(a => STR.en[a.id + '.name']);
  const L = { en: { energy: 'Fast, bright browser games to tap, slice and burn off some steam', play: 'Simple, cheerful browser games for a few minutes off', calm: 'Soft, slow activities for a quiet pause', create: 'Draw, mix and make something of your own' },
              uk: { energy: 'Швидкі яскраві ігри в браузері, щоб тиснути, різати й випускати пару', play: 'Прості веселі ігри в браузері на кілька хвилин', calm: "М'які повільні активності для тихої паузи", create: 'Малюйте, змішуйте й створюйте щось своє' } };
  for (const l of ['en', 'uk']) for (const m of MOODS) STR[l]['meta.mood.' + m + '.desc'] = `${L[l][m]}: ${names(m).join(', ')}.`.slice(0, 300);
  STR.en['meta.home.desc'] = `Take a little break with ${ACTIVITIES.length} free browser games and calm activities: fruit matching, a maze, slicing, a tiny garden, breathing, sand art and more. No sign-up, on your phone or computer.`;
  STR.uk['meta.home.desc'] = `Зробіть маленьку перерву: ${ACTIVITIES.length} безкоштовних ігор і спокійних активностей у браузері — пари фруктів, лабіринт, нарізка, маленький сад, дихання, малювання піском і не тільки. Без реєстрації, на телефоні й комп’ютері.`;
})();

(function applyEmbeddedLocale() {
  const node = document.getElementById('fd-locale');
  if (node && node.dataset && node.textContent) {
    try { STR[node.dataset.lang] = JSON.parse(node.textContent); } catch (e) { console.error(e); }
  }
  const game = document.getElementById('fd-game');
  if (game && game.dataset && game.textContent) {
    try { GT[game.dataset.lang] = JSON.parse(game.textContent); } catch (e) { console.error(e); }
  }
})();
